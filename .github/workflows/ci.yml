name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'
    - name: Install uv
      run: pip install uv
    - name: Create virtual environment and install dependencies
      run: |
        uv venv .venv
        . .venv/bin/activate
        uv pip install -e ".[dev]"
    - name: Lint
      run: |
        . .venv/bin/activate
        pre-commit run --all-files
    - name: Test
      run: |
        . .venv/bin/activate
        coverage run --source=kube_web -m pytest tests/unit
        coverage report
    - name: Build Docker image
      run: |
        docker build -f Dockerfile.uv --build-arg "VERSION=$(git describe --tags --always)" -t kube-web-view:test .
    - name: Scan Docker image for vulnerabilities
      run: |
        docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy image --severity HIGH,CRITICAL kube-web-view:test
