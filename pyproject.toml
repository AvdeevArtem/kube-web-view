[project]
name = "kube-web-view"
version = "24.0.0"
description = "Kubernetes Web View allows to list and view all Kubernetes resources (incl. CRDs) with permalink-friendly URLs in a plain-HTML frontend"
authors = [{ name = "Henning Jacobs", email = "henning@zalando.de" }]
requires-python = "~=3.13"
readme = "README.md"
license = "GPL-3.0+"
dependencies = [
    "pykube-ng>=23.6.0,<24",
    "Jinja2>=3.1.6,<4",
    "aiohttp-jinja2~=1.6",
    "Pygments>=2.19.1,<3",
    "aiohttp_session[secure]>=2.12.1,<3",
    "aioauth-client>=0.30.1,<0.31",
    "aiohttp_remotes>=1.3.0,<2",
    "jmespath>=1.0.1,<2",
    "urllib3>=2.4.0,<3",
    "websockets>=15.0.1,<16",
    "pyee>=13.0.0,<14",
    "lxml[html-clean]>=5.4.0,<6",
]

[project.urls]
Homepage = "https://kube-web-view.readthedocs.io/"
Repository = "https://codeberg.org/hjacobs/kube-web-view"
Documentation = "https://kube-web-view.readthedocs.io/"

[project.scripts]
kube-web-view = "kube_web:main.main"

[dependency-groups]
dev = [
    "pytest>=8.3.5,<9",
    "pytest-cov>=6.1.1,<7",
    "Sphinx>=8.2.3,<9",
    "sphinx-rtd-theme>=3.0.2,<4",
    "requests-html>=0.10.0,<0.11",
    "pytest-kind>=22.11.1",
    "pre-commit>=4.2.0,<5",
]

[tool.hatch.build.targets.sdist]
include = ["kube_web"]

[tool.hatch.build.targets.wheel]
include = ["kube_web"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
