[tool.poetry]
name = "kube-web-view"
version = "24.0.0"
description = "Kubernetes Web View allows to list and view all Kubernetes resources (incl. CRDs) with permalink-friendly URLs in a plain-HTML frontend"
authors = ["Henning Jacobs <henning@zalando.de>"]
license = "GPL-3.0+"
readme = "README.md"
homepage = "https://kube-web-view.readthedocs.io/"
documentation = "https://kube-web-view.readthedocs.io/"
repository = "https://codeberg.org/hjacobs/kube-web-view"
packages = [
    { include = "kube_web" }
]

[tool.poetry.scripts]
kube-web-view = 'kube_web:main.main'

[tool.poetry.dependencies]
python = "^3.13"
pykube-ng = "^23.6.0"
Jinja2 = "^3.1.6"
aiohttp-jinja2 = "^1.6"
Pygments = "^2.19.1"
aiohttp_session = {version = "^2.12.1", extras = ["secure"]}
aioauth-client = "^0.30.1"
aiohttp_remotes = "^1.3.0"
jmespath = "^1.0.1"
urllib3 = "^2.4.0"
websockets = "^15.0.1"
pyee = "^13.0.0"
[tool.poetry.group.dev.dependencies]
pytest = "^8.3.5"
pytest-cov = "^6.1.1"
Sphinx = "^8.2.3"
sphinx-rtd-theme = "^3.0.2"
requests-html = "^0.10.0"
pytest-kind = ">=22.11.1"
pre-commit = "^4.2.0"
[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
